<div class="carta {{ raridade }}">
    <img src="/static/img/{{ imagem }}" alt="{{ nome }}">
    <h2>{{ nome }}</h2>
    <p class="raridade">{{ raridade }}</p>
    <ul>
        <li>Força: {{ força }}</li>
        <li>Habilidades/Poderes: {{ habilidades_poderes }}</li>
        <li>Defesa/Vida: {{ defesa_vida }}</li>
        <li>Velocidade: {{ velocidade }}</li>
    </ul>
    <p>Poder total: <b>{{ poder_total }}</b></p>
    <a class="botao" href="/duelo/{{ chave }}">Duelar com ela</a>
</div>
